[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "surfbench"
version = "0.0.1"
description = "Benchmark of arbitrage-free implied volatility surface fits (SVI, SSVI, eSSVI, SABR) on Deribit BTC and ETH options: held-out accuracy, next-snapshot error and static-arbitrage violations, with confidence intervals."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "surfbench contributors" }]
keywords = [
    "implied-volatility", "volatility-surface", "svi", "ssvi", "essvi", "sabr",
    "static-arbitrage", "options", "deribit", "benchmark", "quant",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]

[project.scripts]
surfbench = "surfbench.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/surfbench"]

[tool.hatch.build.targets.sdist]
include = [
    "src/surfbench", "tests", "docs", "configs", "scripts", "README.md", "LICENSE",
    "CHANGELOG.md", "CONTRIBUTING.md", "SECURITY.md", "CITATION.cff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
