# Quick study (docs/DESIGN.md section 6.5): quarterly first-of-month snapshots 2020-01..2026-10,
# 15-minute next-snapshot horizon. Compute: measured 21-43 s (mean 29 s) per (date, underlying)
# unit on 4 units from live Deribit snapshots of 2026-10-23 (about 300 quotes in 10 expiries
# each, one worker, shared machine), so about 9 minutes for 56 units with 3 workers once the snapshots are cached. The Tardis download
# (projected 2-3 GB streamed, quota-limited) may span several days and resumes month by month.

[study]
name = "quick-v1"
out_dir = "runs/quick-v1"
results_dir = "results/quick-v1"
seed = 20261023
workers = 3

[data]
source = "tardis"
cache_dir = "cache/tardis"
cache_cap_gb = 2.0
months = ["2020-01", "2020-04", "2020-07", "2020-10", "2021-01", "2021-04", "2021-07", "2021-10", "2022-01", "2022-04", "2022-07", "2022-10", "2023-01", "2023-04", "2023-07", "2023-10", "2024-01", "2024-04", "2024-07", "2024-10", "2025-01", "2025-04", "2025-07", "2025-10", "2026-01", "2026-04", "2026-07", "2026-10"]
t0 = "00:01:00"              # UTC; the file starts with a full state dump of every instrument
horizon_min = 15             # t1 = t0 + horizon
fetch_order_seed = 7         # months are fetched in a seeded random order (section 5.1)
request_gap_s = 30           # pause between requests
timeout_s = 60               # socket timeout
max_requests_per_session = 12

[fit]
filter = "configs/filter_v1.toml"
models = ["baseline", "svi", "ssvi", "essvi", "sabr"]
sabr_beta = 1.0
n_folds = 5
weight_floor_iv = 0.005      # residual scale floor (half-spread), decimal vol

[arbitrage]
grid_z = [-4.0, 4.0]         # in units of sqrt(theta) around k = 0
n_grid = 401
g_tol = 1e-6                 # g(k) < -g_tol counts as a butterfly violation
calendar_tol = 1e-8          # w(k, T2) < w(k, T1) - calendar_tol counts as a calendar violation

[report]
n_boot = 10000
block_lengths = [1, 3]       # months; 1 is primary, 3 is a robustness check
alpha = 0.05
primary_metric = "cv_rmse_iv"
stress_quantile = 0.75       # stress month: BTC 30-day ATM IV in the top quartile of the sample
