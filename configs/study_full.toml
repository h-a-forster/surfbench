# Full study (docs/DESIGN.md section 6.5): every first-of-month snapshot 2019-04..2026-10
# (months missing upstream are recorded as unavailable), 60-minute next-snapshot horizon.
# Compute: measured 21-43 s (mean 29 s) per unit on 4 live Deribit units (2026-10-23), so about
# 30 minutes for about 182 units with 3 workers (earlier years have fewer quotes and run faster);
# the download (projected 15-30 GB streamed) is quota-limited and spans many sessions.

[study]
name = "full-v1"
out_dir = "runs/full-v1"
results_dir = "results/full-v1"
seed = 20261023
workers = 3

[data]
source = "tardis"
cache_dir = "cache/tardis"
cache_cap_gb = 2.0
months = ["2019-04", "2019-05", "2019-06", "2019-07", "2019-08", "2019-09", "2019-10", "2019-11", "2019-12", "2020-01", "2020-02", "2020-03", "2020-04", "2020-05", "2020-06", "2020-07", "2020-08", "2020-09", "2020-10", "2020-11", "2020-12", "2021-01", "2021-02", "2021-03", "2021-04", "2021-05", "2021-06", "2021-07", "2021-08", "2021-09", "2021-10", "2021-11", "2021-12", "2022-01", "2022-02", "2022-03", "2022-04", "2022-05", "2022-06", "2022-07", "2022-08", "2022-09", "2022-10", "2022-11", "2022-12", "2023-01", "2023-02", "2023-03", "2023-04", "2023-05", "2023-06", "2023-07", "2023-08", "2023-09", "2023-10", "2023-11", "2023-12", "2024-01", "2024-02", "2024-03", "2024-04", "2024-05", "2024-06", "2024-07", "2024-08", "2024-09", "2024-10", "2024-11", "2024-12", "2025-01", "2025-02", "2025-03", "2025-04", "2025-05", "2025-06", "2025-07", "2025-08", "2025-09", "2025-10", "2025-11", "2025-12", "2026-01", "2026-02", "2026-03", "2026-04", "2026-05", "2026-06", "2026-07", "2026-08", "2026-09", "2026-10"]
t0 = "00:01:00"              # UTC; the file starts with a full state dump of every instrument
horizon_min = 60             # t1 = t0 + horizon
fetch_order_seed = 7         # months are fetched in a seeded random order (section 5.1)
request_gap_s = 30           # pause between requests
timeout_s = 60               # socket timeout
max_requests_per_session = 12

[fit]
filter = "configs/filter_v1.toml"
models = ["baseline", "svi", "ssvi", "essvi", "sabr"]
sabr_beta = 1.0
n_folds = 5
weight_floor_iv = 0.005      # residual scale floor (half-spread), decimal vol

[arbitrage]
grid_z = [-4.0, 4.0]         # in units of sqrt(theta) around k = 0
n_grid = 401
g_tol = 1e-6                 # g(k) < -g_tol counts as a butterfly violation
calendar_tol = 1e-8          # w(k, T2) < w(k, T1) - calendar_tol counts as a calendar violation

[report]
n_boot = 10000
block_lengths = [1, 3]       # months; 1 is primary, 3 is a robustness check
alpha = 0.05
primary_metric = "cv_rmse_iv"
stress_quantile = 0.75       # stress month: BTC 30-day ATM IV in the top quartile of the sample
